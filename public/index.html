<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시너지 미적분1 오답노트 & 손풀이 검색기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- KaTeX for math equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Navbar -->
    <header class="navbar no-print">
      <div class="brand">
        <span class="logo-badge">시너지</span>
        <div class="brand-text">
          <h1>미적분1 오답노트 & 손풀이 검색</h1>
          <span class="subtext" id="dbRangeSubtext">노션 DB 연동 (0001~0940번)</span>
        </div>
      </div>
      <div class="nav-actions">
        <span class="stats-text" id="statsText">로딩 중...</span>
        <button id="syncBtn" class="btn-sync" title="노션 최신 데이터 동기화">
          <svg class="sync-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span id="syncBtnText">노션 동기화</span>
        </button>
      </div>
    </header>

    <!-- Search Bar & Filters (No-Print) -->
    <section class="search-section no-print">
      <div class="search-bar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="번호 또는 범위 입력 (예: 120-124, 1, 3, 5~10, 936, 904-940)"
            value="120-124"
            autocomplete="off"
            autofocus
          >
          <button id="clearSearchBtn" class="btn-clear hidden" title="지우기">✕</button>
        </div>
        <button id="searchSubmitBtn" class="btn-search">검색</button>
      </div>

      <!-- Quick Chips -->
      <div class="quick-chips">
        <span class="chips-label">빠른 선택:</span>
        <button class="chip active-preset" data-query="120-124">120~124번</button>
        <button class="chip" data-query="22-38">22~38번</button>
        <button class="chip" data-query="1-15">1~15번</button>
        <button class="chip" data-query="904-940">904~940번</button>
        <button class="chip chip-sol" data-query="sol">손풀이 있는 문제만</button>
        <button class="chip chip-all" data-query="all" id="chipAllBtn">전체 문항</button>
      </div>
    </section>

    <!-- Sheet Control Bar -->
    <div class="sheet-toolbar" id="sheetToolbar">
      <div class="toolbar-left">
        <span class="list-title">문항 목록</span>
        <span class="result-count" id="resultCountBadge">0건</span>
      </div>

      <div class="toolbar-filters no-print">
        <select id="unitFilterSelect" class="filter-select">
          <option value="">전체 단원</option>
        </select>

        <div class="diff-btn-group">
          <button class="diff-btn active" data-diff="">전체 난이도</button>
          <button class="diff-btn" data-diff="상">상</button>
          <button class="diff-btn" data-diff="중">중</button>
          <button class="diff-btn" data-diff="하">하</button>
        </div>

        <label class="toggle-label">
          <input type="checkbox" id="onlySolToggle">
          <span>영상 있는 문제만</span>
        </label>
      </div>

      <div class="toolbar-right no-print">
        <button id="printBtn" class="btn-print" title="오답노트 출력 / PDF 저장">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          <span>인쇄 / PDF</span>
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingIndicator" class="loading-state hidden">
      <div class="spinner"></div>
      <p>문항 데이터 조회 중...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <p class="empty-msg">해당 조건에 일치하는 문제가 없습니다.</p>
      <div class="empty-chips">
        <button class="chip" onclick="applyPreset('120-124')">120~124번</button>
        <button class="chip" onclick="applyPreset('22-38')">22~38번</button>
        <button class="chip" onclick="applyPreset('')">전체 문항 보기</button>
      </div>
    </div>

    <!-- Problem List (간소화된 콤팩트 오답노트 리스트) -->
    <div id="problemsList" class="problems-list"></div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">링크가 복사되었습니다!</div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
